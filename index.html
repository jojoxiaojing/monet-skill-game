<style>
/* Layout: one 16:9 painted stage centred on garden shade; museum-label paper floats on the painting; touch controls sit under it */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --shade:#1e2925;      /* the shade of the garden around the canvas */
  --paper:#f6f0e4;      /* museum label paper */
  --paper-edge:#d9cdb6;
  --ink:#352c4c;        /* violet-black ink */
  --muted:#6c6283;
  --violet:#7a5ab8;     /* her dress */
  --poppy:#d6442c;
  --gold:#c39236;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-latin:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --u:9px;
  color-scheme:light;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--shade);color:var(--ink);font-family:var(--f-han);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:2px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#d9dbe2}
#cv{display:block;width:100%;height:100%;touch-action:none}

.label{position:absolute;left:calc(var(--u)*2.2);top:calc(var(--u)*2);display:grid;gap:calc(var(--u)*.25);max-width:44%;
  padding:calc(var(--u)*.9) calc(var(--u)*1.3);background:var(--paper);border:1px solid var(--paper-edge);color:var(--ink);
  box-shadow:0 2px 0 rgba(53,44,76,.12);transition:opacity .9s ease,transform .9s ease}
.label.out{opacity:0;transform:translateY(-6px)}
.lt{font-weight:700;font-size:max(13px,calc(var(--u)*1.7));letter-spacing:.06em;line-height:1.25;text-wrap:balance}
.ll{font-family:var(--f-latin);font-style:italic;font-size:max(12px,calc(var(--u)*1.45));color:var(--muted);line-height:1.1}
.lh{font-size:max(11px,calc(var(--u)*1.1));color:var(--ink);line-height:1.5;border-top:1px solid var(--paper-edge);padding-top:calc(var(--u)*.4);margin-top:calc(var(--u)*.2)}

.hud{position:absolute;right:calc(var(--u)*2);top:calc(var(--u)*2);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:calc(var(--u)*.6);max-width:52%}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.32em .7em;background:var(--paper);border:1px solid var(--paper-edge);
  font:500 max(11px,calc(var(--u)*1.15))/1.2 var(--f-han);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700}
.chip.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.14)}}
.dot{width:.7em;height:.7em;border-radius:50%;display:inline-block}
.dot.poppy{background:var(--poppy)}.dot.wist{background:var(--violet)}.dot.sun{background:var(--gold)}
.btn{cursor:pointer}
.btn:hover{background:#fffaf0}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(64%,640px);max-height:92%;overflow:auto;
  padding:calc(var(--u)*2.6) calc(var(--u)*3);background:var(--paper);border:1px solid var(--paper-edge);
  box-shadow:0 10px 40px rgba(30,25,50,.28);display:grid;gap:calc(var(--u)*1.1);text-align:left}
.eyebrow{font-family:var(--f-latin);font-style:italic;font-size:max(13px,calc(var(--u)*1.7));color:var(--muted);line-height:1}
.card h1{margin:0;font-size:max(22px,calc(var(--u)*4.2));line-height:1.1;letter-spacing:.08em;font-weight:700;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--violet)}
.card p{margin:0;font-size:max(12px,calc(var(--u)*1.4));line-height:1.75;max-width:34em}
.keys{display:flex;flex-wrap:wrap;gap:.4em 1.2em;font-size:max(11px,calc(var(--u)*1.15));color:var(--muted)}
.keys kbd{font:600 .95em/1 var(--f-latin);border:1px solid var(--paper-edge);border-bottom-width:2px;padding:.15em .45em;background:#fffaf0;color:var(--ink)}
.go{justify-self:start;font:700 max(14px,calc(var(--u)*1.6))/1 var(--f-han);letter-spacing:.12em;color:var(--paper);background:var(--violet);
  border:0;padding:.8em 1.6em;cursor:pointer;box-shadow:0 3px 0 #4f3a86}
.go:hover:not(:disabled){background:#6a4aa8}
.go:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #4f3a86}
.go:disabled{background:#a99cc4;box-shadow:none;cursor:progress}
.go.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--paper-edge)}
.go.ghost:hover{background:#fffaf0}
.credit{font-size:max(11px,calc(var(--u)*1.05));color:var(--muted);line-height:1.5}
.credit a{color:var(--violet)}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1)}

.plaque{position:absolute;left:50%;bottom:calc(var(--u)*6.2);transform:translateX(-50%);width:min(56%,560px);
  padding:calc(var(--u)*1.6) calc(var(--u)*2.2);background:linear-gradient(#f8f0dc,#efe2c2);border:1px solid #b89a5a;
  box-shadow:0 6px 24px rgba(40,25,10,.35);display:grid;gap:calc(var(--u)*.8);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
.plaque .pt{font-weight:700;font-size:max(15px,calc(var(--u)*2.2));letter-spacing:.06em;line-height:1.2}
.plaque .pl{font-family:var(--f-latin);font-style:italic;font-size:max(12px,calc(var(--u)*1.35));color:var(--muted)}
.plaque .pc{font-size:max(12px,calc(var(--u)*1.3));line-height:1.7}

.touch{display:none;width:100%;justify-content:space-between;align-items:center;gap:12px}
.touch.on{display:flex}
.touch .pad{display:flex;gap:12px}
.touch button{width:64px;height:56px;border:1px solid var(--paper-edge);background:var(--paper);color:var(--ink);
  font:700 18px/1 var(--f-han);border-radius:6px;touch-action:none}
.touch button.jb{width:88px;background:var(--violet);color:var(--paper);border-color:#4f3a86}
.touch button.held{transform:translateY(2px);filter:brightness(.92)}

.small .card p.long{display:none}
.small .label .lh{display:none}
.small .card{padding:12px 14px;gap:8px;width:84%}
.small .plaque{width:80%;bottom:8px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.label,.plaque,.chip.pop{transition:none;animation:none}}

<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1600" height="900" aria-label="莫奈花园散步：游戏画面"></canvas>

    <div class="label out" id="label" aria-live="polite">
      <span class="lt" id="lt">罂粟田</span>
      <span class="ll" id="ll">Claude Monet · Les Coquelicots · 1873</span>
      <span class="lh" id="lh">沿着小路，找到五朵发光的罂粟</span>
    </div>

    <div class="hud" id="hud" hidden>
      <span class="chip" id="k0"><i class="dot poppy"></i>罂粟 <b id="c0">0</b>/5</span>
      <span class="chip" id="k1"><i class="dot wist"></i>紫藤 <b id="c1">0</b>/5</span>
      <span class="chip" id="k2"><i class="dot sun"></i>夕光 <b id="c2">0</b>/5</span>
      <button class="chip btn" id="snd" type="button" aria-pressed="true">声音 开</button>
    </div>

    <div class="card" id="title">
      <span class="eyebrow">Promenade chez Monet</span>
      <h1>莫奈花园<em>散步</em></h1>
      <p class="long">穿紫裙子的小女孩要走过莫奈的三幅画：阿让特伊的罂粟田、睡莲池上的日本桥、日落时的干草堆。路上把发光的罂粟、紫藤和夕光收进手里的花束，走到画架前，这次散步就成了一幅画。</p>
      <div class="keys"><span><kbd>←</kbd> <kbd>→</kbd> 走</span><span><kbd>空格</kbd> 跳</span><span>手机：按住箭头走，点「跳」</span></div>
      <button class="go" id="start" type="button" disabled>调色中…</button>
      <span class="credit">画法与长卷结构来自 <a href="https://github.com/alchaincyf/huashu-art-motion" target="_blank" rel="noopener">huashu-art-motion</a> skill（花叔）</span>
    </div>

    <div class="plaque" id="plaque" hidden>
      <span class="pt">《紫衣小女孩散步》</span>
      <span class="pl">d'après Claude Monet · 2026</span>
      <span class="pc" id="pc"></span>
      <div class="row"><button class="go" id="again" type="button">再走一遍</button><button class="go ghost" id="stay" type="button">留在画里逛逛</button></div>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="pad"><button type="button" data-k="l" aria-label="向左走">◀</button><button type="button" data-k="r" aria-label="向右走">▶</button></div>
    <button type="button" class="jb" data-k="j">跳</button>
  </div>
</div>

<script>
(() => {
'use strict';
// =====================================================================
//  画法来自 huashu-art-motion：底稿平涂 → 分区色板的流场短笔触重画（每格独立种子，位置不重洗）
//  → 母题一直在动（水面光斑、睡莲、柳条、罂粟、紫藤、夕阳）。静态部分开局一次烘焙，动态部分每帧画。
// =====================================================================
const VW = 1600, VH = 900, G = 700, TAU = Math.PI * 2, PAR = 0.25, MARG = 260;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const hash = (i, j = 0) => { let h = (i * 374761393 + j * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const perm = new Uint8Array(512);
{ const r = rng(1337), p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const grd = (h, x, y) => { const u = (h & 1) ? x : -x, v = (h & 2) ? y : -y; return (h & 4) ? u + v * 0.5 : u * 0.5 + v; };
const noise = (x, y) => { const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y), a = perm[X] + Y, b = perm[X + 1] + Y;
  return lerp(lerp(grd(perm[a], x, y), grd(perm[b], x - 1, y), u), lerp(grd(perm[a + 1], x, y - 1), grd(perm[b + 1], x - 1, y - 1), u), v); };
const fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f); a *= 0.5; f *= 2; } return s; };
const hex = h => { const n = parseInt(h.replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const jit = (c, r, amt) => [c[0] + (r() - .5) * amt, c[1] + (r() - .5) * amt, c[2] + (r() - .5) * amt];
const swatch = (hs, mb = 0.35) => { const cs = hs.map(hex); return (col, r) => mix(cs[(r() * cs.length) | 0], col, mb); };
const pick = (a, r) => a[(r() * a.length) | 0];
const lum = c => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
const cellRng = (i, j, seed) => rng((Math.floor(hash(i * 131 + seed * 7919, j * 31 + seed) * 4294967296)) >>> 0);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

// 笔触重画（skill 的 XING.strokes：任意尺寸画布，每格独立种子）
function strokes(g, src, { cell = 10, len = 24, width = 6, angle, palette, seed = 1, mask, alphaMask = false, alphaMin = 180, jitterCol = 14, skip, cap = 'round', alpha = 1 } = {}) {
  const w = src.width, h = src.height, sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  g.save(); g.lineCap = cap;
  for (let j = 0; j * cell < h + cell; j++) for (let i = 0; i * cell < w + cell; i++) {
    const r = cellRng(i, j, seed);
    const px = i * cell + (r() - 0.5) * cell, py = j * cell + (r() - 0.5) * cell;
    const ix = clamp(px | 0, 0, w - 1), iy = clamp(py | 0, 0, h - 1), k = (iy * w + ix) * 4;
    if (alphaMask && sd[k + 3] < alphaMin) continue;
    if (mask && !mask(px, py)) continue;
    let col = [sd[k], sd[k + 1], sd[k + 2]];
    if (skip && skip(col, px, py, r)) continue;
    const pc = palette ? palette(px, py, col, r) : null;
    col = pc || jit(col, r, jitterCol);
    const a = angle ? angle(px, py, r) : 0, l = len * (0.7 + r() * 0.6), dx = Math.cos(a) * l / 2, dy = Math.sin(a) * l / 2;
    g.strokeStyle = rgb(col, alpha); g.lineWidth = width * (0.8 + r() * 0.4);
    g.beginPath(); g.moveTo(px - dx, py - dy); g.lineTo(px + dx, py + dy); g.stroke();
  }
  g.restore();
}
// 一块小图：先平涂 fn(g)，再在不透明处按色板出笔（边缘也是笔触）
function painted(w, h, fn, opt) {
  const base = mk(w, h); fn(base.getContext('2d'));
  const out = mk(w, h), og = out.getContext('2d');
  if (opt.under !== false) { og.globalAlpha = opt.under ?? 1; og.drawImage(base, 0, 0); og.globalAlpha = 1; }
  if (opt.atop) og.globalCompositeOperation = 'source-atop';
  strokes(og, base, { alphaMask: true, alphaMin: 90, ...opt });
  return out;
}

// ============================ 世界 ============================
const WORLDS = [
  { id: 'poppy', x0: 0, w: 3000, title: '罂粟田', latin: 'Les Coquelicots · 1873', hint: '沿着小路，找到五朵发光的罂粟', hasSky: true },
  { id: 'bridge', x0: 3000, w: 3200, title: '睡莲池上的日本桥', latin: 'Le Pont japonais · 1899', hint: '跳起来，摘下垂得最低的紫藤', hasSky: false },
  { id: 'stacks', x0: 6200, w: 3000, title: '干草堆，日落', latin: 'Meules, soleil couchant · 1891', hint: '跳上干草堆，接住五束夕光', hasSky: true },
];
const TOTAL = 9200;
const env = (lx, w, d = 350) => ss(0, d, lx) * ss(0, d, w - lx);
// 地面（世界内局部坐标）
WORLDS[0].ground = lx => G + (16 * Math.sin(lx * 0.0023 + 1) + 11 * Math.sin(lx * 0.0061)) * env(lx, 3000);
const BR = { x0: 850, x1: 2350, lift: 125 };
const deckY = lx => { const q = clamp((lx - (BR.x0 + BR.x1) / 2) / ((BR.x1 - BR.x0) / 2), -1, 1); return G - BR.lift * (1 - q * q); };
WORLDS[1].ground = lx => (lx > BR.x0 && lx < BR.x1) ? deckY(lx) : G;
WORLDS[2].ground = lx => G + 6 * Math.sin(lx * 0.004) * env(lx, 3000);
const worldAt = x => { for (const W of WORLDS) if (x < W.x0 + W.w) return W; return WORLDS[WORLDS.length - 1]; };
const groundAt = x => { const W = worldAt(x); return W.ground(x - W.x0); };

// 干草堆（也是平台）：屋顶曲线＝可以站的地方
const STACKS = [[520, 250, 165], [1180, 300, 195], [1720, 210, 130], [1985, 320, 215], [2420, 270, 175]].map(([cx, wb, hb]) => {
  const by = G - 6, gx = 6200 + cx;
  const roof = x => { const q = Math.abs(x - gx) / (wb * 0.55); return by - hb + hb * 0.42 * Math.pow(q, 1.6); };
  return { lx: cx, cx: gx, wb, hb, by, roof, top: x => roof(x) + 3, inside: x => Math.abs(x - gx) < wb * 0.55 * 0.84 };
});
const EASEL_X = 6200 + 2790;

// 收集物
const ITEMS = [];
[520, 1060, 1590, 2130, 2660].forEach((lx, i) => ITEMS.push({ type: 0, x: lx, y: WORLDS[0].ground(lx) - 6, ph: i * 1.7 }));
[[520, G - 310], [1180, deckY(1180) - 300], [1600, deckY(1600) - 305], [2040, deckY(2040) - 300], [2760, G - 310]].forEach(([lx, y], i) => ITEMS.push({ type: 1, x: 3000 + lx, y, ph: i * 2.1 }));
[[300, G - 262], [520, STACKS[0].roof(STACKS[0].cx) - 240], [1180, STACKS[1].roof(STACKS[1].cx) - 240], [1985, STACKS[3].roof(STACKS[3].cx) - 245], [2615, G - 268]].forEach(([lx, y], i) => ITEMS.push({ type: 2, x: 6200 + lx, y, ph: i * 1.3 }));
ITEMS.forEach((it, i) => { it.id = i; it.got = false; it.y0 = it.y; });

// ---------------------------------------------------------------- 罂粟田
const SWP = {
  mead: swatch(['#8fb060', '#a8c070', '#c8cc78', '#7a9a58', '#9ab0a0', '#b8b0d0', '#6f8f5a', '#d8d48a', '#b4c888'], 0.42),
  fore: swatch(['#5f8a48', '#4f7a42', '#7aa050', '#3f6a48', '#8ab060', '#6a7a9a', '#a0b868', '#5a7a5a'], 0.4),
  far: swatch(['#4f6f5a', '#6a8a6a', '#3f5a5a', '#5a7090', '#8aa070', '#2f4a48', '#9aaa98', '#7a8aa8'], 0.5),
  path: swatch(['#d8cc98', '#c8bc8a', '#e0d4a8', '#b8b0b8', '#cfc48e', '#bcc08a', '#e8dcb8'], 0.4),
  poppy: swatch(['#e04a2e', '#f06a40', '#c8322a', '#f08a5a', '#d8503a', '#e86848'], 0.3),
  wall: swatch(['#f6f0e4', '#efe6f0', '#e8e0d0', '#d8d0e0'], 0.35),
  roof: swatch(['#d06040', '#e07a50', '#b84a3a', '#e89060'], 0.35),
  sky: swatch(['#9fb8de', '#b8cce6', '#d8e0ee', '#c8c0e0', '#e8e4dc', '#a8c0e0', '#8eaad6', '#f0e8dc'], 0.5),
  cloud: swatch(['#ffffff', '#f6f1e8', '#e8e4f0', '#d4d0e4', '#c8d0e6', '#f8f0dc', '#dcd8ea'], 0.45),
};
function bakePoppy(W) {
  const M = MARG, w = W.w, CW = w + 2 * M, L = cx => cx - M, gy = W.ground;
  const H1 = lx => 452 + 22 * Math.sin(lx * 0.0017 + 0.6) + 16 * fbm(lx * 0.004, 2.2);
  const MT = lx => H1(lx) + 34 + 8 * Math.sin(lx * 0.009);
  const R = rng(101), base = mk(CW, VH), b = base.getContext('2d');
  // 远山
  b.fillStyle = '#93a8a0'; b.beginPath(); b.moveTo(0, VH); for (let cx = 0; cx <= CW; cx += 10) b.lineTo(cx, H1(L(cx))); b.lineTo(CW, VH); b.closePath(); b.fill();
  // 树丛
  for (let i = 0; i < CW * 0.1; i++) { const cx = R() * CW, lx = L(cx), d = fbm(lx * 0.0025, 7.7); if (d < -0.08) continue;

// ============================ 更新 ============================
const SPEED = 270, ACC = 1900, GRAV = 2400, JUMPV = 960;
function update(dt) {
  T += dt;
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.vx *= 0.97; }
  parts = parts.filter(p => p.t < p.life);
  for (const f of flyers) { f.t += dt; if (f.t >= f.dur && !f.done) { f.done = true; bouquet.push(f.type); } }
  flyers = flyers.filter(f => !f.done);
  ripples = ripples.filter(r => T - r.t < 2.4);

  const W1 = WORLDS[0]; if (W1.flies) for (const f of W1.flies) { const d = Math.hypot(f.x - girl.x, f.y - (girl.y - 100)); if (d < 150) f.scare = 1.6;
    f.scare = Math.max(0, f.scare - dt); const tx = f.hx + Math.sin(T * 0.7 + f.ph) * 120 + (f.scare > 0 ? Math.sign(f.x - girl.x) * 220 : 0), ty = f.hy + Math.sin(T * 1.3 + f.ph) * 40 - (f.scare > 0 ? 180 : 0);

  let dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (state === 'ending') { const tx = EASEL_X - 110; dir = girl.x < tx - 6 ? 1 : 0; if (!dir) { girl.face = 1; } endT += dt; if (endT > 2.0 && plaqueEl.hidden) showPlaque(); }
  if (girl.pickT > 0) { girl.pickT -= dt; dir = 0; }
  if (dir) girl.face = dir;
  const tv = dir * SPEED; girl.vx += clamp(tv - girl.vx, -ACC * dt, ACC * dt);
  girl.x = clamp(girl.x + girl.vx * dt, 70, TOTAL - 70);
  if (state === 'free') girl.x = Math.min(girl.x, TOTAL - 70);
  girl.jumpBuf = Math.max(0, girl.jumpBuf - dt); girl.coyote = Math.max(0, girl.coyote - dt);

    else girl.y = groundAt(girl.x);
  }
  if (!girl.grounded) { const py = girl.y; girl.vy += GRAV * dt; girl.y += girl.vy * dt;
    if (girl.vy > 0) for (const s of STACKS) if (s.inside(girl.x)) { const ty = s.top(girl.x); if (py <= ty + 6 && girl.y >= ty) { girl.y = ty; land(s); break; } }
    const gy = groundAt(girl.x); if (!girl.grounded && girl.y >= gy) { girl.y = gy; land(null); } }
  if (girl.grounded && Math.abs(girl.vx) > 25) { const before = Math.floor(girl.walkPh * 2); girl.walkPh += Math.abs(girl.vx) * dt / 120; if (Math.floor(girl.walkPh * 2) !== before) sfx('step'); }
  // 收集
  if (state === 'play' || state === 'free') for (const it of ITEMS) { if (it.got) continue; const dx = Math.abs(it.x - girl.x);
    if (it.type === 0 ? (dx < 34 && girl.grounded) : (dx < 44 && it.y > girl.y - 228 && it.y < girl.y + 10)) collect(it); }
  // 进入新的画：标签
  const W = worldAt(girl.x); if (W !== curWorld) { curWorld = W; showLabel(W); }
  if (state === 'play' && girl.x >= EASEL_X - 140) startEnding();
  // 镜头
  const lead = state === 'ending' || state === 'free' && girl.x > EASEL_X - 400 ? 0.62 : girl.face > 0 ? 0.40 : 0.58;
  const target = clamp(girl.x - VW * lead, 0, TOTAL - VW); camX += (target - camX) * Math.min(1, dt * 3.2);

  if (s) { WORLDS[2].birds.push(...[0, 1, 2, 3].map(k => ({ x: s.cx - 40 + k * 26, y: s.roof(s.cx) - 10 - k * 6, vx: -120 - k * 30, vy: -170 - k * 25, t: T + k * 0.08, ph: k }))); WORLDS[2].birds = WORLDS[2].birds.filter(b => T - b.t < 6); }
}

$('snd').addEventListener('click', () => { audioInit(); muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, AC.currentTime, 0.05); $('snd').textContent = muted ? '声音 关' : '声音 开'; $('snd').setAttribute('aria-pressed', String(!muted)); });

const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', Space: 'j', ArrowUp: 'j', KeyW: 'j' };
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) { if (e.code === 'Enter' && state === 'title' && !startBtn.disabled) startBtn.click(); return; }
  if (e.target.tagName === 'BUTTON' && (e.code === 'Space')) { if (state === 'title' || !plaqueEl.hidden) return; }
  e.preventDefault(); if (state === 'title' && !startBtn.disabled && k === 'j') { startBtn.click(); return; }
  if (k === 'j') { if (!keys.j) girl.jumpBuf = 0.14; keys.j = true; } else keys[k] = true; });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.l = keys.r = keys.j = false; });
touchEl.querySelectorAll('button').forEach(bt => { const k = bt.dataset.k;
  const on = e => { e.preventDefault(); bt.setPointerCapture?.(e.pointerId); bt.classList.add('held'); if (k === 'j') girl.jumpBuf = 0.14; else keys[k] = true; if (state === 'title' && !startBtn.disabled) startBtn.click(); };
  const off = () => { bt.classList.remove('held'); if (k !== 'j') keys[k] = false; };
  bt.addEventListener('pointerdown', on); bt.addEventListener('pointerup', off); bt.addEventListener('pointercancel', off); bt.addEventListener('lostpointercapture', off); bt.addEventListener('contextmenu', e => e.preventDefault()); });
const coarse = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (coarse) touchEl.classList.add('on');

function layout() { const app = $('app'), aw = app.clientWidth, ah = app.clientHeight - (touchEl.classList.contains('on') ? touchEl.offsetHeight + 10 : 0);
  const w = Math.max(200, Math.min(aw, ah * 16 / 9)); stage.style.width = w + 'px'; touchEl.style.width = w + 'px'; stage.style.setProperty('--u', (w / 100) + 'px'); stage.classList.toggle('small', w < 620); }
addEventListener('resize', layout); layout();

// ============================ 声音 ============================
let AC = null, master = null, FX = null, muted = false, nextBeat = 0, beat = 0, noiseBuf = null;
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 64], [48, 55, 59, 64]];
const MEL = [[72, 74, 76, 79, 81, 84], [71, 74, 76, 79, 83], [69, 72, 74, 76, 81], [67, 71, 72, 76, 79]];
function audioInit() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
  FX = AC.createDelay(); FX.delayTime.value = 0.34; const fb = AC.createGain(); fb.gain.value = 0.34; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; FX.connect(lp); lp.connect(fb); fb.connect(FX); lp.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.08, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  nextBeat = AC.currentTime + 0.1; setInterval(schedule, 120); }
function tone(f, t0, dur, vol, type = 'triangle', send = 0.35, att = 0.015) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g); g.connect(master);
  if (send) { const s = AC.createGain(); s.gain.value = send; g.connect(s); s.connect(FX); } o.start(t0); o.stop(t0 + dur + 0.05); }
function schedule() { if (!AC) return; const step = 0.36;
  while (nextBeat < AC.currentTime + 0.5) { const bar = Math.floor(beat / 8) % 4;
    if (beat % 8 === 0) CHORDS[bar].forEach((m, i) => tone(NOTE(m), nextBeat + i * 0.02, step * 8.5, 0.022, 'sine', 0.25, 0.9));
    const r = hash(beat, 77); if (r < 0.5) tone(NOTE(MEL[bar][(hash(beat, 3) * MEL[bar].length) | 0]), nextBeat, 1.3, 0.04, 'triangle', 0.4);
    nextBeat += step; beat++; } }
function sfx(kind, k) { if (!AC || muted) return; const t = AC.currentTime;
  if (kind === 'chime') { const base = [76, 79, 83][k] || 76; [0, 4, 7, 12].forEach((iv, i) => tone(NOTE(base + iv), t + i * 0.07, 0.9, 0.07, 'sine', 0.5)); }
  else if (kind === 'step') { const W = worldAt(girl.x), onBridge = W.id === 'bridge' && girl.x > W.x0 + BR.x0 && girl.x < W.x0 + BR.x1;
    if (onBridge) tone(170 + hash(Math.round(T * 50)) * 30, t, 0.09, 0.05, 'sine', 0); else { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 900 + hash(Math.round(T * 50)) * 700; g.gain.value = 0.05; s.connect(f); f.connect(g); g.connect(master); s.start(t); } }
  else if (kind === 'jump') tone(NOTE(67), t, 0.25, 0.03, 'sine', 0.2);
  else if (kind === 'land') { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0.08; s.connect(f); f.connect(g); g.connect(master); s.start(t); }
  else if (kind === 'end') [72, 76, 79, 84, 88].forEach((m, i) => tone(NOTE(m), t + i * 0.16, 1.6, 0.06, 'sine', 0.5)); }

// ============================ 启动 ============================
let last = performance.now();
function loop(now) { const dt = Math.min(1 / 30, (now - last) / 1000); last = now; if (baked) { update(dt); render(); } requestAnimationFrame(loop); }
const wait = () => new Promise(r => setTimeout(r, 16));
async function boot(data) {
  const steps = [() => bakeGirl(), () => bakePoppy(WORLDS[0]), () => bakeBridge(WORLDS[1]), () => bakeStacks(WORLDS[2])];
  for (let i = 0; i < steps.length; i++) { startBtn.textContent = `调色中 ${i + 1}/${steps.length}…`; await wait(); steps[i](); if (i === 1) { baked = true; state = 'title'; } }
  startBtn.disabled = false; startBtn.textContent = '开始散步';
  if (data && data.state && data.state !== 'title' && data.state !== 'loading') {   // 页面热更新后接着走
    (data.got || []).forEach(id => { const it = ITEMS[id]; if (it) { it.got = true; got[it.type]++; bouquet.push(it.type); } });
    girl.x = data.x || 240; girl.y = groundAt(girl.x); camX = clamp(girl.x - VW * 0.4, 0, TOTAL - VW); titleEl.hidden = true; hudEl.hidden = false; state = data.state === 'ending' ? 'free' : data.state; updateHud(); }
}
window.claude?.hot?.snapshot?.(() => ({ x: girl.x, got: ITEMS.filter(i => i.got).map(i => i.id), state }));
requestAnimationFrame(loop);
window.__game = { girl, ITEMS, WORLDS, get state() { return state; }, set state(v) { state = v; }, keys, get camX() { return camX; }, set camX(v) { camX = v; }, update, render, startEnding };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
